<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GS Business</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--g:#111111;--g2:#8a6508;--gl:#faf3dc;--ac:#d4af37;--gold:linear-gradient(135deg,#e6c35c,#c9a227 55%,#b8901f);--tx:#1f2937;--mt:#6b7280;--bd:#e7e2d3;--bg:#f6f4ee;--rd:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:30px}
header{background:#000;color:#fff;padding:12px 16px 14px;text-align:center;border-bottom:3px solid var(--ac)}
header img{height:84px;width:auto;display:block;margin:0 auto 2px}
header b{display:block;font-size:22px;font-weight:700;letter-spacing:.3px}
header small{color:#e6c35c;font-size:11px;letter-spacing:1.6px;text-transform:uppercase}
body>section{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:18px;margin:14px auto;width:calc(100% - 24px);max-width:860px;box-shadow:0 1px 2px rgba(16,24,40,.06),0 6px 16px rgba(16,24,40,.04)}
h2,h3{margin:0 0 4px;color:var(--g);font-size:17px;font-weight:700}
h2{font-size:18px}
.sh h2,.sh h3{letter-spacing:.2px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--bd)}
.sh h2,.sh h3{margin:0}
section.min>:not(.sh){display:none}
section.min>.sh{margin-bottom:0;padding-bottom:0;border-bottom:none}
section input,section select{width:100%;padding:11px 12px;margin-top:8px;font-size:15px;font-family:inherit;color:var(--tx);background:#fff;border:1px solid #d1d5db;border-radius:10px;transition:.15s}
section input:focus,section select:focus{outline:none;border-color:#b8901f;box-shadow:0 0 0 3px rgba(201,162,39,.3)}
section input[readonly]{background:#f9fafb;color:var(--g);font-weight:600}
section button{width:100%;padding:12px;margin-top:10px;font-size:15px;font-weight:600;font-family:inherit;background:var(--gold);color:#111;border:none;border-radius:10px;cursor:pointer;transition:.15s}
section button:hover{filter:brightness(1.07)}
section button.sec{background:#fff;color:var(--g2);border:1px solid #b8901f}
section button.sec:hover{background:var(--gl);filter:none}
section td button{width:auto;margin:0;padding:5px 10px;font-size:13px;background:#fef3f2;color:var(--rd);border:1px solid #fecdca}
section li button{width:auto;margin-top:6px;padding:6px 12px;font-size:13px;background:#fff;color:var(--g2);border:1px solid #b8901f}
.sh .mm{width:36px;height:36px;margin:0;padding:0;font-size:16px;background:var(--gl);color:var(--g2);border:none}
.sh .mm:hover{background:#f1e3b5;filter:none}
section table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
section th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mt);text-align:left;padding:8px;border-bottom:2px solid var(--bd)}
section td{padding:10px 8px;border-bottom:1px solid #f0f2f1;text-align:left}
.tab{display:inline-block;padding:8px 18px;margin:0 6px 4px 0;background:#eef1ef;color:var(--mt);border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;transition:.15s}
.tab.active{background:var(--gold);color:#111}
.alert{color:var(--rd);font-weight:600;white-space:pre-line;background:#fef3f2;border-radius:8px;padding:10px 12px;margin:10px 0 0}
.alert:empty{display:none}
#resumoCaixa{color:var(--g);background:var(--gl)}
.hidden{display:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:560px){.g2{grid-template-columns:1fr}}
.totalbox{display:flex;justify-content:space-between;align-items:center;background:var(--gl);border:1px solid #e3cf8c;border-radius:12px;padding:14px 16px;margin-top:14px;font-weight:600}
.totalbox b{font-size:22px;color:var(--g)}
.troco{display:flex;justify-content:space-between;color:var(--mt);font-size:14px;margin:10px 4px 0}
.troco b{color:var(--tx)}
ul{list-style:none;padding:0;margin:0}
li{border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.6}
#historicoUl:empty::after{content:"Sem vendas registadas.";color:var(--mt)}
#fatura{display:none}
/* Fatura A4 */
@page{size:A4;margin:15mm}
@media print{
  body>*:not(#fatura){display:none!important}
  body{background:#fff}
  #fatura{display:block;color:#000;font-size:12pt}
}
.f-top{display:flex;justify-content:space-between;border-bottom:3px solid #b8901f;padding-bottom:10px;margin-bottom:16px}
.f-top h1{margin:0;color:#111;font-size:22pt}
.f-top p{margin:2px 0;font-size:10pt}
.f-tit{text-align:right}
.f-tit h2{margin:0;font-size:18pt;color:#000}
.f-info{display:flex;justify-content:space-between;margin-bottom:14px;font-size:11pt}
#fatura table{margin:0}
#fatura th{background:#111;color:#e6c35c;padding:8px;text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#fatura td{padding:7px 8px;text-align:left;border-bottom:1px solid #ddd}
#fatura .r{text-align:right}
.f-tot{margin:14px 0 0 auto;width:55%;font-size:11pt}
.f-tot div{display:flex;justify-content:space-between;padding:4px 0}
.f-tot .g{border-top:2px solid #b8901f;font-weight:bold;font-size:14pt;margin-top:4px;padding-top:8px}
.f-foot{margin-top:40px;text-align:center;font-size:10pt;color:#444;border-top:1px solid #ccc;padding-top:8px}

.f-cards{display:flex;gap:10px;margin:14px 0}
.f-card{flex:1;border:1px solid #b8901f;border-radius:6px;padding:8px 10px}
.f-card small{display:block;color:#555;font-size:9pt;text-transform:uppercase}
.f-card b{font-size:14pt;color:#111}
.f-h3{margin:18px 0 6px;font-size:12pt;color:#8a6508;border-bottom:1px solid #b8901f;padding-bottom:3px}
.f-sub td{font-weight:bold;background:#faf3dc;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.f-assin{display:flex;justify-content:space-around;margin-top:60px;font-size:10pt}
.f-assin div{width:40%;border-top:1px solid #000;text-align:center;padding-top:4px}
#fatura tr{page-break-inside:avoid}

.sbar{display:flex;flex-wrap:wrap;gap:4px 18px;background:#111;color:#e6c35c;border-radius:12px;padding:10px 14px;font-size:13px;margin:12px auto 0;width:calc(100% - 24px);max-width:860px}
.sbar b{color:#fff}
.sbar.hidden{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
section button.tile{background:#111;color:#e6c35c;border:1px solid #b8901f;padding:24px 12px;font-size:17px;margin:0}
section button.tile small{display:block;color:#bbb;font-weight:400;font-size:12px;margin-top:4px}
.sh .back{width:auto;margin:0;padding:8px 14px;font-size:14px;background:#fff;color:var(--g2);border:1px solid #b8901f}
.sh .back:hover{background:var(--gl);filter:none}
h3.sub{margin:16px 0 0;font-size:15px}
.combo{position:relative}
.combo-l{position:absolute;left:0;right:0;top:100%;z-index:50;background:#fff;border:1px solid #d1d5db;border-radius:10px;max-height:240px;overflow:auto;box-shadow:0 8px 20px rgba(0,0,0,.18);margin-top:4px}
.combo-l div{padding:11px 12px;border-bottom:1px solid #f0f2f1;cursor:pointer}
.combo-l div:hover{background:#faf3dc}
.combo-l small{color:#6b7280}
.avs{border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px;font-weight:600}
.avs.w{background:#fff7e0;color:#8a6508;border:1px solid #e3cf8c}
.avs.r{background:#fef3f2;color:#b42318;border:1px solid #fecdca}
.avisoStock:empty{display:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.ov.hidden{display:none}
.ovcard{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:380px;border-top:4px solid #d4af37;text-align:center}
.ovcard h3{margin:0 0 8px;color:#111}
.ovcard p{margin:0 0 6px;font-size:14px;color:#4b5563}
.ovcard button{width:100%;padding:12px;margin-top:10px;font-size:15px;font-weight:600;font-family:inherit;background:var(--gold);color:#111;border:none;border-radius:10px;cursor:pointer}
.ovcard button.sec{background:#fff;color:var(--g2);border:1px solid #b8901f}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111;color:#e6c35c;padding:10px 16px;border-radius:10px;font-size:14px;z-index:2000;max-width:90%;text-align:center}
.toast.hidden{display:none}
.f-by{text-align:center;margin-top:8px;font-size:9pt;letter-spacing:.8px;color:#8a6508}
.f-by b{color:#111}
@font-face{font-family:"Inter";src:url(inter-400.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Inter";src:url(inter-600.woff) format("woff");font-weight:600 700;font-display:swap}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;margin-right:6px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sbox{position:relative}
.sbox>svg.ic{position:absolute;left:13px;top:calc(50% + 4px);transform:translateY(-50%);margin:0;color:#8a6508;pointer-events:none;z-index:1}
.sbox>input{padding-left:38px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{border:1px solid #e3cf8c;background:#faf3dc;border-radius:12px;padding:10px 6px;text-align:center}
.kpi small{display:block;color:#6b7280;font-size:10px;letter-spacing:.5px;text-transform:uppercase}
.kpi b{font-size:15px;color:#111}
#splash{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:5000;transition:opacity .4s}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:min(70vw,340px);height:auto}
.f-brand{display:flex;align-items:center;gap:10px}
.f-logo{height:17mm;width:auto;border-radius:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ===== Tema luxo preto e dourado ===== */
body{background:#070707 radial-gradient(ellipse at 50% 100%,rgba(201,162,39,.2),transparent 60%) fixed}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 16px;padding:12px 14px;text-align:left;background:#000 url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20400%20170%27%20preserveAspectRatio%3D%27xMidYMid%20slice%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%271%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%23f5d77a%27/%3E%3Cstop%20offset%3D%27.5%27%20stop-color%3D%27%23c9a227%27/%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%236b5410%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%27400%27%20height%3D%27170%27%20fill%3D%27%23000%27/%3E%3Cpath%20d%3D%27M0%200H80C50%2045%2022%2068%200%2078Z%27%20fill%3D%27url%28%23g%29%27/%3E%3Cpath%20d%3D%27M0%208H40C28%2030%2014%2044%200%2052Z%27%20fill%3D%27%23000%27%20opacity%3D%27.5%27/%3E%3Cpath%20d%3D%27M0%2090C100%2078%20175%20135%20270%20170H0Z%27%20fill%3D%27url%28%23g%29%27%20opacity%3D%27.3%27/%3E%3Cpath%20d%3D%27M400%20170C325%20135%20322%2065%20400%2022V170Z%27%20fill%3D%27url%28%23g%29%27%20opacity%3D%27.28%27/%3E%3Cpath%20d%3D%27M0%20112C110%2098%20220%20152%20400%20122%27%20stroke%3D%27%23e6c35c%27%20stroke-width%3D%271.2%27%20fill%3D%27none%27%20opacity%3D%27.7%27/%3E%3C/svg%3E") center/cover no-repeat;border-bottom:3px solid var(--ac)}
header img{height:auto;width:min(56%,250px);margin:0}
.hfeat{display:flex;flex-direction:column;gap:7px;border-left:1px solid #c9a227;padding-left:14px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#f1f1f1;font-weight:500}
.hfeat span{display:flex;align-items:center;gap:8px}
.hfeat span:not(.ico)::before{content:"";width:6px;height:6px;border-radius:50%;background:#e6c35c;flex:none}
.hfeat .ic{width:22px;height:22px;color:#e6c35c;margin:0}
.hbtns{position:static!important;flex:0 0 100%;order:-1;justify-content:flex-end;margin:0!important}
#rodape{color:#c9a227!important}
body>section{border-color:#c9a227}
body>section.dark{background:linear-gradient(160deg,#171717,#050505);border:1.5px solid #c9a227;box-shadow:0 0 0 1px rgba(255,220,120,.15),0 8px 26px rgba(0,0,0,.7)}
body>section.bare{background:none;border:none;box-shadow:none;padding:0}
.dark .sh{border-bottom-color:#2f2a18}
.dark h2,.dark h3{color:#f3e2a6}
.dark p{color:#e8e8e8!important}.dark p b{color:#e6c35c}
.dark .sh .back{background:transparent;color:#e6c35c;border-color:#c9a227}
.tagline{font-family:"Brush Script MT","Segoe Script","Snell Roundhand",cursive,Georgia,serif;font-style:italic;color:#e6c35c;font-size:15px;margin:-4px 0 12px}
.tiles{grid-template-columns:1fr!important;gap:0}
section button.tile{display:grid;grid-template-columns:50px 1px 1fr 36px;align-items:center;gap:14px;text-align:left;padding:15px 14px;margin:12px 0 0;background:linear-gradient(145deg,#1d1d1d,#060606);border:1.5px solid #c9a227;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(255,220,120,.12),0 0 14px rgba(201,162,39,.2);color:#fff;font-size:18px;font-weight:600}
.tile .ti{display:flex;justify-content:center;color:#e6c35c}
.tile .ti svg{width:34px;height:34px;margin:0;stroke-width:1.6}
.tile .sep{width:1px;height:44px;background:#c9a227;opacity:.7}
section button.tile .tx{color:#fff}
section button.tile small{display:block;font-weight:400;font-size:13px;color:#cfcfcf;margin-top:2px}
.tile .chev{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#111;display:flex;align-items:center;justify-content:center}
.tile .chev svg{width:18px;height:18px;margin:0;stroke-width:2.6}
.kpis{gap:8px}
.kpi{display:flex;align-items:center;gap:8px;text-align:left;background:linear-gradient(145deg,#1d1d1d,#060606);border:1.5px solid #c9a227;border-radius:14px;padding:10px 8px;box-shadow:0 0 12px rgba(201,162,39,.18)}
.kpi .ic{width:28px;height:28px;color:#e6c35c;margin:0;flex:none;stroke-width:1.6}
.kpi small{color:#e6c35c;font-size:10px;letter-spacing:.4px}
.kpi b{color:#fff;font-size:14px}
.sbar{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:6px;background:linear-gradient(160deg,#171717,#050505);border:1.5px solid #c9a227;border-radius:14px;padding:10px 8px;margin-top:12px}
.sbar .si{display:flex;align-items:center;gap:6px;min-width:0;font-size:11px;color:#e6c35c}
.sbar .si+.si{border-left:1px solid #3a3320;padding-left:6px}
.sbar .si .ic{width:20px;height:20px;margin:0;flex:none;color:#e6c35c}
.sbar b{display:block;color:#fff;font-size:12px;overflow-wrap:anywhere}

header img{mix-blend-mode:screen}
.kpis{grid-template-columns:repeat(3,minmax(0,1fr))!important}
.kpi{padding:9px 6px;min-width:0}
.kpi>div{min-width:0}
.kpi small{display:block;overflow-wrap:anywhere}
.dark .avs.w{background:#2a2410;color:#e6c35c;border-color:#8a6508}
.dark .avs.r{background:#2a0f0d;color:#ff9b8f;border-color:#7a2a22}
.dark .avs .ic{color:inherit}

header{padding:12px 10px}
header img{width:min(48%,220px)}
.hfeat{font-size:11px;letter-spacing:.6px;padding-left:12px;gap:6px}
section td,section th{padding:8px 5px}
section table{font-size:13px}
